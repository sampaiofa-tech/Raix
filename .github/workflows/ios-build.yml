name: iOS Simulator Arm64 CI

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'pages/**'
      - 'LICENSE'
      - 'LICENSE-COMMERCIAL.md'
      - 'CLA.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'pages/**'
      - 'LICENSE'
      - 'LICENSE-COMMERCIAL.md'
      - 'CLA.md'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Simulator Arm64 Binaries
        run: ./gradlew :composeApp:iosSimulatorArm64Binaries --stacktrace
