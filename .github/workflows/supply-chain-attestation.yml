name: Supply Chain Integrity & SLSA Attestation (P0.4)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  verify-dependencies:
    name: Verify Pinned Dependencies & Hashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Verify Functions Hashes (npm ci)
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Dependency Verification (SHA-256)
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Verify CycloneDX SBOM Generation
        run: node scripts/generate_sbom.cjs

      - name: Check Git Working Directory Cleanliness
        run: git diff --exit-code docs/sbom/

  slsa-attestation:
    name: Generate SLSA Build Provenance (SLSA Level 2+)
    needs: verify-dependencies
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Java
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Desktop Artifact
        run: ./gradlew :composeApp:desktopJar --no-daemon

      - name: Attest Desktop Build Provenance (SLSA Level 2+)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: composeApp/build/libs/*.jar
