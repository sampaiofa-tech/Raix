name: Maintenance - Prune Legacy Caches

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'

permissions:
  actions: write

jobs:
  prune-caches:
    name: Prune Legacy & Orphan Actions Caches
    runs-on: ubuntu-latest
    steps:
      - name: Prune Caches
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Fetching existing repository caches...');
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            console.log(`Total caches found: ${caches.length}`);

            let deletedCount = 0;
            let deletedBytes = 0;

            for (const cache of caches) {
              // Preserve active node cache and any new optimized OS-level gradle caches
              if (
                cache.key.startsWith('node-cache-') ||
                cache.key.startsWith('Linux-gradle-') ||
                cache.key.startsWith('macOS-gradle-')
              ) {
                console.log(`[PRESERVE] Keeping active cache: ${cache.key} (${(cache.size_in_bytes / (1024 * 1024)).toFixed(2)} MB)`);
                continue;
              }

              // Delete legacy, bloated, and per-commit caches
              console.log(`[DELETE] Removing legacy cache: ${cache.key} (ID: ${cache.id}, ${(cache.size_in_bytes / (1024 * 1024)).toFixed(2)} MB)`);
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id
                });
                deletedCount++;
                deletedBytes += cache.size_in_bytes;
              } catch (err) {
                console.error(`Failed to delete cache ID ${cache.id}:`, err.message);
              }
            }

            console.log('--- RESUMO DA LIMPEZA ---');
            console.log(`Caches removidos: ${deletedCount}`);
            console.log(`Espaço liberado: ${(deletedBytes / (1024 * 1024 * 1024)).toFixed(3)} GB (${(deletedBytes / (1024 * 1024)).toFixed(2)} MB)`);
