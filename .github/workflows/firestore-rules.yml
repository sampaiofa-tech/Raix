name: Firestore Security Rules & Adversarial Suite

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'functions/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'functions/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

jobs:
  adversarial-rules-suite:
    name: Adversarial Rules & Isolation Test (Emulator Suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 17 (Required for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Functions Dependencies
        run: |
          npm ci --prefix functions

      - name: Run Adversarial Rules Suite in Firebase Emulator
        run: |
          npx -y firebase-tools@latest emulators:exec --only firestore "npm --prefix functions run test:emulator"
